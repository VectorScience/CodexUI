name: Build and publish desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg,app
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg,app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PNPM
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version and prepare changelog
        id: notes
        run: node scripts/prepare-release.mjs

      - name: Test session context menu
        run: pnpm test

      - name: Test session transfer
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && '-' || '' }}
        with:
          tagName: ${{ steps.notes.outputs.tag }}
          releaseName: CodexUI ${{ steps.notes.outputs.tag }} — 跨电脑继续完整会话
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          args: ${{ matrix.args }}

  publish:
    name: Publish complete release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Verify installers and publish release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id, per_page: 100 });
            const installers = [
              ['Windows EXE', /\.exe$/i],
              ['Windows MSI', /\.msi$/i],
              ['macOS Apple Silicon DMG', /aarch64.*\.dmg$/i],
              ['macOS Intel DMG', /(?:x64|x86_64).*\.dmg$/i],
            ];
            for (const [platform, pattern] of installers) {
              if (!assets.some(asset => pattern.test(asset.name) && asset.size > 0 && asset.state === 'uploaded')) {
                throw new Error(`Missing complete installer: ${platform}. Release remains a draft.`);
              }
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false, prerelease: false, make_latest: 'true' });
            core.notice(`Published ${release.html_url}`);
