name: Publish verified desktop release

on:
  workflow_run:
    workflows: [Build and publish desktop apps]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify installers and publish
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify source, build jobs and installers before publication
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid stable release version');
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            let sourceSha = ref.object.sha;
            if (ref.object.type === 'tag') {
              const { data: annotated } = await github.rest.git.getTag({ owner, repo, tag_sha: sourceSha });
              sourceSha = annotated.object.sha;
            }
            if (sourceSha !== run.head_sha) throw new Error('Release tag does not match the completed build source');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: run.id, filter: 'latest', per_page: 100 });
            for (const name of ['Windows x64', 'macOS Apple Silicon', 'macOS Intel']) {
              if (!jobs.some(job => job.name === name && job.conclusion === 'success')) {
                throw new Error(`Build did not succeed: ${name}. Release remains a draft.`);
              }
            }
            // GitHub's tag lookup only returns published releases. List releases to find drafts.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === tag);
            if (!release) throw new Error(`No release found for ${tag}`);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id, per_page: 100 });
            const installers = [
              ['Windows EXE', /\.exe$/i],
              ['Windows MSI', /\.msi$/i],
              ['macOS Apple Silicon DMG', /aarch64.*\.dmg$/i],
              ['macOS Intel DMG', /(?:x64|x86_64).*\.dmg$/i],
            ];
            for (const [platform, pattern] of installers) {
              if (!assets.some(asset => pattern.test(asset.name) && asset.size > 0 && asset.state === 'uploaded')) {
                throw new Error(`Missing complete installer: ${platform}. Release remains a draft.`);
              }
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false, prerelease: false, make_latest: 'true' });
            core.notice(`Published https://github.com/${owner}/${repo}/releases/tag/${tag}`);
