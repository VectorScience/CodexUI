[package]
name = "codex-ui"
version = "0.1.1"
description = "ChatGPT Desktop wallpaper switcher"
authors = ["CodexUI"]
edition = "2021"

[lib]
name = "codexui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tungstenite = "0.26"
url = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
